name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install psycopg2-binary
      - name: Build the database from the migrations and run the suite
        run: bash scripts/run_tests.sh
      - name: Run the demo (must finish without a script error)
        run: bash scripts/demo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Device client (TypeScript) - install, type-check, test against the database
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm test
